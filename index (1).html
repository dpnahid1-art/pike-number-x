.au{max-width:440px;margin:0 auto;padding:70px 22px 50px}
.au .logo{text-align:center;font-size:30px;margin-bottom:30px}

function beep(){if(!pref.snd)return;try{const a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=880;g.gain.setValueAtTime(.15,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.35);o.start();o.stop(a.currentTime+.35)}catch(e){}}
async function copy(t){try{await navigator.clipboard.writeText(t);return true}catch(e){try{const x=document.createElement('textarea');x.value=t;document.body.appendChild(x);x.select();document.execCommand('copy');x.remove();return true}catch(e2){return false}}}

async function api(path,o={}){
  let r;try{r=await fetch(BASE+path,{...o,headers:{'mknetwork-key':KEY,...(o.body?{'Content-Type':'application/json'}:{})}})}
  catch(e){throw new Error('Network error. Please check your connection and try again.')}
  const j=await r.json().catch(()=>null);
  if(!r.ok||!j||(j.meta&&j.meta.status!=='success'))throw new Error((j&&j.message)||'Error '+r.status);
  return j.data||{};
}
const view=h=>$('#view').innerHTML=h;
const sc=(l,v,c,sm)=>`<div class="sc" style="--c:${c}"><div class="sl">${l}</div><div class="sv${sm?' sm':''}">${v}</div></div>`;
const pt=s=>{const m=String(s).match(/(\d+)-(\d+)-(\d+)[ T](\d+):(\d+):(\d+)/);return m?new Date(+m[1],m[2]-1,+m[3],+m[4],+m[5],+m[6]):null};
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],z=n=>String(n).padStart(2,'0');
const fmt=s=>{const d=pt(s);if(!d)return esc(s||'');const h=d.getHours();return `${z(h%12||12)}:${z(d.getMinutes())}:${z(d.getSeconds())} ${h<12?'AM':'PM'} · ${z(d.getDate())} ${MON[d.getMonth()]} ${d.getFullYear()}`};
const ageS=s=>{const d=pt(s);return d?Math.max(0,Math.round((Date.now()+off-d)/1000)):null};
const agoT=a=>a===null?'':a<60?a+'s ago':a<3600?Math.floor(a/60)+'m ago':Math.floor(a/3600)+'h ago';
const rangeOf=n=>{const d=String(n||'').replace('+','').split('*')[0].replace(/\D/g,'');return d?d.slice(0,Math.max(4,d.length))+'XXX':'—'};
const ccl=d=>{if(d[0]==='1'||d[0]==='7')return 1;return ['20','27','30','31','32','33','34','36','39','40','41','43','44','45','46','47','48','49','51','52','53','54','55','56','57','58','60','61','62','63','64','65','66','81','82','84','86','90','91','92','93','94','95','98'].includes(d.slice(0,2))?2:3};
const cpb=t=>`<button class="cp" data-c="${esc(t)}" aria-label="Copy">${ic('copy',18)}</button>`;
document.addEventListener('click',async e=>{const b=e.target.closest('[data-c]');if(!b)return;

    <div class="g2"><div><label>Password *</label>${ai('pw','Min. 6 chars','password')}</div><div><label>Confirm *</label>${ai('pw2','Re-enter','password')}</div></div>

    <label>Gmail Address</label>${ai('e','yourname@gmail.com','email')}
    <label>Password</label>${ai('pw','Password','password')}
    <div class="ck"><input type="checkbox" id="kp" checked><span>Keep me signed in</span></div>
    <button class="go" id="sub">Sign In</button>
    <p class="s" style="text-align:center;margin-top:22px">NEW HERE? <span class="lnk" id="sw">Create an Account</span></p></div>`;
    $('#sub').onclick=login;$('#pw').onkeydown=e=>{if(e.key==='Enter')login()};
  }

}
const aerr=m=>{const e=$('#aerr');if(!e)return;e.textContent=m||'';e.classList.toggle('show',!!m)};
const nice=e=>({'auth/invalid-credential':'Wrong email or password','auth/email-already-in-use':'This email is already registered','auth/weak-password':'Password must be at least 6 characters','auth/invalid-email':'Invalid email'}[e.code]||e.message);
async function login(){
  const e=$('#e').value.trim(),p=$('#pw').value;if(!e||!p)return aerr('Enter email and password');
  const b=$('#sub');b.disabled=true;aerr('');
  try{await auth.setPersistence($('#kp').checked?firebase.auth.Auth.Persistence.LOCAL:firebase.auth.Auth.Persistence.SESSION);await auth.signInWithEmailAndPassword(e,p)}
  catch(x){aerr(nice(x))}
  b.disabled=false;
}
async function signup(){
  const v=id=>$('#'+id).value.trim(),n=v('n'),e=v('e'),p=v('p'),a=v('a').toLowerCase(),t=v('t'),pw=$('#pw').value;
  if(!n||!e||!p||!a||!t)return aerr('Please fill in all fields');
  if(!/^[^\s@]+@gmail\.com$/i.test(e))return aerr('Enter a valid Gmail address');
  if(pw.length<6)return aerr('Password must be at least 6 characters');
  if(pw!==$('#pw2').value)return aerr('Passwords do not match');
  if(!$('#pp').checked)return aerr('Please accept the Privacy Policy');
  const b=$('#sub');b.disabled=true;aerr('');signing=true;
  try{
    const cred=await auth.createUserWithEmailAndPassword(e,pw);
    const q=await db.collection('agents').where('email','==',a).where('active','==',true).get();
    if(q.empty&&e.toLowerCase()!==ADMIN_EMAIL.toLowerCase()){await cred.user.delete();signing=false;b.disabled=false;return aerr('Agent email is invalid or disabled')}
    await db.collection('users').doc(cred.user.uid).set({name:n,email:e.toLowerCase(),phone:p,agent:a,tg:t,balance:0,otps:0,banned:false,created:Date.now()});
    signing=false;boot(cred.user);
  }catch(x){signing=false;aerr(nice(x))}
  b.disabled=false;
}
auth.onAuthStateChanged(u=>{if(signing)return;u?boot(u):(cleanup(),showAuth('login'))});
function cleanup(){me=null;hist=[];if(unsub)unsub();unsub=null;timers.forEach(clearInterval);timers=[];$('#app').hidden=true}
async function boot(u){
  const ref=db.collection('users').doc(u.uid);
  let s=await ref.get();
  if(!s.exists){await ref.set({name:u.email.split('@')[0],email:u.email.toLowerCase(),phone:'',agent:'',tg:'',balance:0,otps:0,banned:false,created:Date.now()});s=await ref.get()}
  if(s.data().banned){await auth.signOut();showAuth('login');aerr('Your account has been banned');return}
  me={uid:u.uid,...s.data()};
  try{const c=await db.collection('settings').doc('config').get();if(c.exists)cfg={...cfg,...c.data()}}catch(e){}
  try{hist=JSON.parse(ls.g('px_hist_'+me.uid)||'[]')}catch(e){hist=[]}
  if(unsub)unsub();
  unsub=ref.onSnapshot(d=>{if(!d.exists)return;me={uid:me.uid,...d.data()};if(me.banned){auth.signOut();return}if(['dash','wallet','id'].includes(page))PG[page]()});
  $('#auth').hidden=true;$('#app').hidden=false;
  $('#av').textContent=me.name.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
  syncTime();go('nums');
}

/* ---------- Numbers ---------- */
const stOf=h=>h.status==='pending'&&h.exp<Date.now()?'expired':h.status;
const SL={success:'Success',pending:'Pending',expired:'Expired',not_found:'Failed'};
function fnum(h){let n=String(h.number||'').replace('+','');if($('#nat')&&$('#nat').checked)n='0'+n.slice(ccl(n));if($('#plus')&&$('#plus').checked)return n;return n}
let lastSig='';
function pNums(){
  lastSig='';
  view(head('NUMBER ALLOCATION','Get a Virtual Number',1)+`<div class="stats" id="st"></div>
  <div class="panel pad"><div class="lab">YOUR CHOICE RANGE</div><div class="inp">#<input id="rng" placeholder="2372XXX" autocapitalize="characters" value="${esc(ls.g('px_range')||'')}"></div>
  <div class="rr" id="rec"></div>
  <div class="two"><label class="chk"><input type="checkbox" id="nat">National Format</label><label class="chk"><input type="checkbox" id="plus">Remove (+)</label></div>
  <button class="go" id="get">⚡ GET NUMBER</button></div>
  <div class="panel"><div class="ph">📡 <b>Active &amp; Recent</b><button class="rf" id="rf" aria-label="Refresh">${ic('refresh',20)}</button><span class="cnt" id="cnt"></span></div>
  <div class="sub"><select class="sel" id="fl"><option value="all">All</option><option value="success">Success</option><option value="pending">Pending</option><option value="expired">Expired</option></select><select class="sel" id="dt"><option value="t">Today</option><option value="a">All time</option></select></div><div class="list" id="list"></div></div>`);
  $('#get').onclick=getNum;$('#rf').onclick=()=>poll(true);
  $('#rng').onkeydown=e=>{if(e.key==='Enter')getNum()};
  ['#fl','#dt','#nat','#plus'].forEach(s=>$(s).onchange=draw);
  drawRec();draw();timers.push(setInterval(tick,1000));
}
function drawRec(){const e=$('#rec');if(!e)return;e.innerHTML=rec.map(r=>`<button class="chip" data-r="${esc(r)}">${esc(r)}</button>`).join('');$$('[data-r]').forEach(b=>b.onclick=()=>{$('#rng').value=b.dataset.r})}
function tick(){
  if(page!=='nums')return;
  const sig=hist.map(h=>h.id+stOf(h)+(h.otp||'')).join()+$('#fl').value+$('#dt').value+$('#nat').checked+$('#plus').checked;
  if(sig!==lastSig){draw();return}
  $$('[data-exp]').forEach(e=>{const left=Math.max(0,Math.round((+e.dataset.exp-Date.now())/1000));e.textContent=z(Math.floor(left/60))+':'+z(left%60)});
}
function draw(){
  if(page!=='nums')return;
  const t0=new Date().setHours(0,0,0,0),day=$('#dt').value==='t',f=$('#fl').value;
  lastSig=hist.map(h=>h.id+stOf(h)+(h.otp||'')).join()+$('#fl').value+$('#dt').value+$('#nat').checked+$('#plus').checked;
  const today=hist.filter(h=>h.t>=t0);
  $('#st').innerHTML=sc("TODAY'S TOTAL",today.length,'var(--b)')+sc('OTP SUCCESS',today.filter(h=>stOf(h)==='success').length,'var(--g)')+sc('LIVE PENDING',today.filter(h=>stOf(h)==='pending').length,'var(--o)')+sc('FAILED / LOST',today.filter(h=>['expired','not_found'].includes(stOf(h))).length,'var(--r)');
  const rows=hist.filter(h=>(!day||h.t>=t0)&&(f==='all'||stOf(h)===f));
  $('#cnt').textContent=rows.length+' total';
  $('#list').innerHTML=rows.length?rows.map(h=>{const s=stOf(h),left=Math.max(0,Math.round((h.exp-Date.now())/1000));
    return `<div class="nc ${s}"><div class="nrow"><span class="n">${esc(fnum(h))}</span>${cpb(fnum(h))}<span class="bd ${s}">${SL[s]||s}</span></div>
    <div class="sms"><small>OTP / SMS</small>${h.otp?`<button class="otp" data-c="${esc(h.otp)}" aria-label="Copy OTP">${esc(h.otp)}<span>TAP TO COPY</span></button>${esc(h.sms||'')}`:s==='pending'?'<i>Waiting for OTP…</i>':'<i>No OTP received</i>'}</div>
    <div class="meta"><div><small>COUNTRY / OPERATOR</small><b>${esc(h.country)}</b><br>${esc(h.operator)}</div><div class="r"><small>TIMER / EXPIRY</small><b>${s==='pending'?`<span data-exp="${h.exp}">${z(Math.floor(left/60))+':'+z(left%60)}</span>`:s==='success'?'Received':'Expired'}</b></div></div></div>`}).join(''):'<div class="empty">No numbers yet. Enter a range and tap GET NUMBER.</div>';
}
async function getNum(){
  const r=$('#rng').value.trim().toUpperCase().replace(/[+\s]/g,'');
  if(!r){err('Enter a range, like 2372XXX.');return}
  ls.s('px_range',r);rec=[r,...rec.filter(x=>x!==r)].slice(0,6);ls.s('px_rec',JSON.stringify(rec));drawRec();
  const b=$('#get');b.disabled=true;b.textContent='…';
  try{const d=await api('/getnum/number',{method:'POST',body:JSON.stringify({range:r})});
    hist.unshift({id:d.request_id,number:d.number||d.full_number,country:d.country,operator:d.operator,status:d.status||'pending',otp:null,sms:null,exp:Date.now()+(d.seconds_remaining||900)*1000,t:Date.now()});
    saveH();err('');toast('Number ready');
  }catch(e){err(e.message)}
  b.disabled=false;b.textContent='⚡ GET NUMBER';draw();
}
async function poll(force){
  if(!me)return;
  const ids=hist.filter(h=>h.status==='pending'&&(force||h.exp>Date.now()-20000)).map(h=>h.id);if(!ids.length)return;
  try{const d=await api('/check/status',{method:'POST',body:JSON.stringify({request_ids:ids})});
    let got=null,n=0;
    (d.results||[]).forEach(r=>{const h=hist.find(x=>x.id===r.request_id);if(!h)return;if(r.otp_code&&!h.otp){got=r.otp_code;n++}h.status=r.status;if(r.otp_code){h.otp=r.otp_code;h.sms=r.full_sms}});
    saveH();draw();
    if(n){db.collection('users').doc(me.uid).update({balance:FV.increment(+(cfg.otpRate*n).toFixed(6)),otps:FV.increment(n)}).catch(()=>{})}
    if(got){beep();if(pref.auto){const ok=await copy(got);toast(ok?'OTP '+got+' copied ✓':'OTP '+got+' received')}else toast('OTP '+got+' received')}
  }catch(e){}
}
setInterval(poll,4000);

  const ok=hist.filter(h=>stOf(h)==='success').length,rate=hist.length?Math.round(ok/hist.length*100):0;
  view(head('AUDIT','My Audit')+`<div class="stats">${sc('TOTAL',hist.length,'var(--b)')+sc('SUCCESS RATE',rate+'%','var(--g)')}</div>
  <div class="panel"><div class="ph"><b>Local activity</b><span class="cnt">${hist.length} total</span></div>`+(hist.length?hist.map(h=>`<div class="kv"><span>${esc(h.number)}<br><small style="color:var(--tx4)">${new Date(h.t).toLocaleString()}</small></span><span class="bd ${stOf(h)}" style="margin:0;height:fit-content">${SL[stOf(h)]||stOf(h)}</span></div>`).join(''):'<div class="empty">No activity yet.</div>')+'</div>');
}
function pId(){
  view(head('PREFERENCES','Identity')+'<div class="panel" id="ip"></div>');
  const role=me.email.toLowerCase()===ADMIN_EMAIL.toLowerCase()?'admin':'user';
  $('#ip').innerHTML=[['Name',me.name],['Email',me.email],['Phone',me.phone],['Telegram / WhatsApp',me.tg],['Agent',me.agent],['User ID',me.uid.slice(0,8)],['Role',role]].map(([k,v])=>`<div class="kv"><span>${k}</span><span>${esc(v||'—')}</span></div>`).join('');
}
function pSet(){
  const dark=document.documentElement.dataset.theme==='dark';
  view(head('PREFERENCES','Settings')+`<div class="panel">
  <div class="kv" style="border-top:0"><span>Dark mode</span><button class="tgl ${dark?'on':''}" id="s1" aria-label="Dark mode"></button></div>
  <div class="kv"><span>Auto-copy OTP</span><button class="tgl ${pref.auto?'on':''}" id="s2" aria-label="Auto-copy OTP"></button></div>
  <div class="kv"><span>Sound on OTP</span><button class="tgl ${pref.snd?'on':''}" id="s3" aria-label="Sound"></button></div></div>
  <div class="panel pad" style="display:grid;gap:12px"><button class="go ghost" id="ex">⬇ Export history (CSV)</button><button class="go dng" id="cl2">🗑 Clear local history</button></div>`);
  $('#s1').onclick=()=>{setTheme(dark?'light':'dark');pSet()};
  $('#s2').onclick=()=>{pref.auto=!pref.auto;ls.s('px_auto',pref.auto?'1':'0');pSet()};
  $('#s3').onclick=()=>{pref.snd=!pref.snd;ls.s('px_snd',pref.snd?'1':'0');if(pref.snd)beep();pSet()};
  $('#ex').onclick=()=>{
    if(!hist.length){toast('Nothing to export');return}
    const csv='number,country,operator,status,otp,time\n'+hist.map(h=>[h.number,h.country,h.operator,stOf(h),h.otp||'',new Date(h.t).toISOString()].map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n');
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='pikex-history.csv';a.click();toast('Exported');
  };
  $('#cl2').onclick=()=>{if(confirm('Delete all local history?')){hist=[];saveH();toast('History cleared');pSet()}};
}
function pDev(){
  view(head('PREFERENCES','Developer Access')+`<div class="panel"><div class="cs"><div class="orb"><div class="rg1"></div><div class="rg2"></div><div class="core"></div></div><h2>Coming Soon</h2><p>Developer API is on the way</p></div></div>`);
}
</script>
